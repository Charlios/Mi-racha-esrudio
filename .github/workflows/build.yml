
name: Compilar Mi Racha de Estudio

on:
  workflow_dispatch:
  push:
    paths:
      - 'MiRachaEstudio_Android_30min.zip'
      - 'index.html'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v5

      - name: Descomprimir proyecto
        run: unzip MiRachaEstudio_Android_30min.zip -d proyecto

      - name: Aplicar pantalla y versión 1.1
        run: |
          ASSETS_DIR="$(find proyecto -type d -path '*/app/src/assets' | head -n 1)"
          if [ -z "$ASSETS_DIR" ]; then
            ASSETS_DIR="$(find proyecto -type d -path '*/app/src/main/assets' | head -n 1)"
          fi
          if [ -z "$ASSETS_DIR" ]; then
            echo "No se encontró la carpeta assets"
            find proyecto -type d -name assets
            exit 1
          fi

          cp index.html "$ASSETS_DIR/index.html"

          GRADLE_FILE="$(find proyecto -path '*/app/build.gradle' -type f | head -n 1)"
          if [ -z "$GRADLE_FILE" ]; then
            echo "No se encontró app/build.gradle"
            exit 1
          fi

          sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode 2/' "$GRADLE_FILE"
          sed -i -E 's/versionName[[:space:]]+"[^"]+"/versionName "1.1"/' "$GRADLE_FILE"

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Instalar herramientas Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: |
          PROJECT_DIR="$(find proyecto -name build.gradle -type f | grep '/app/build.gradle$' | head -n 1 | sed 's|/app/build.gradle||')"
          if [ -z "$PROJECT_DIR" ]; then
            echo "No se ha encontrado el proyecto Android dentro del ZIP"
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Guardar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Racha-de-Estudio-APK
          path: proyecto/**/app/build/outputs/apk/debug/*.apk
