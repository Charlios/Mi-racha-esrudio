
name: Compilar Mi Racha de Estudio

on:
  workflow_dispatch:
  push:
    paths:
      - 'MiRachaEstudio_Android_30min.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: unzip MiRachaEstudio_Android_30min.zip -d proyecto

      - name: Localizar proyecto Android
        run: |
          find proyecto -name gradlew -type f
          find proyecto -name build.gradle -type f
          find proyecto -name build.gradle.kts -type f

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar herramientas Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: |
          PROJECT_DIR="$(find proyecto -name build.gradle -type f | grep '/app/build.gradle$' | head -n 1 | sed 's|/app/build.gradle||')"
          if [ -z "$PROJECT_DIR" ]; then
            echo "No se ha encontrado el proyecto Android dentro del ZIP"
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Guardar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Racha-de-Estudio-APK
          path: proyecto/**/app/build/outputs/apk/debug/*.apk
